<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6FBF9">
<script>
(function () {
  try {
    var u = new URL(location.href);
    if (!u.searchParams.has('sharecode') && !sessionStorage.getItem('hexin_sc_fix')) {
      sessionStorage.setItem('hexin_sc_fix', '1');
      u.searchParams.set('sharecode', 'UYTBFHUV4H');
      location.replace(u.toString());
    }
  } catch (e) {}
})();
</script>
<title>颌·心 · 候诊自评</title>
<link rel="stylesheet" href="css/app.css?v=2312">
</head>
<body>

<div class="p-wrap">

  <header class="p-head">
    <div class="p-brand">
      <div class="p-logo">颌</div>
      <div>
        <div class="p-brand-name">颌·心</div>
        <div class="p-brand-sub">候诊自评 · 约 3 分钟</div>
      </div>
    </div>
  </header>

  <!-- ===== 开始前 ===== -->
  <section id="intro">
    <div class="card">
      <p class="tip"><span id="pWhoWrap">你好，<b id="pWho">—</b>。</span>本次就诊号：<b id="pNo">—</b></p>
      <p class="tip">这份候诊自评仅记录您的主观感受，供医生面诊参考，减少重复问诊。</p>
      <p class="tip">问卷共 4 段 40 题，评估您的状态、口腔习惯与下颌相关感受；疼痛、弹响、张口情况等体征，将由医生当面检查，本问卷无需填写。</p>
    </div>

    <button class="btn btn-primary" id="btnBegin">开始填写</button>
    <button class="btn btn-ghost" id="btnSwitch" style="width:100%;margin-top:10px">不是我 / 换个就诊号</button>

    <p class="disc">本页只收集本次就诊的自评答案。答案存在本院工作台，不对外提供。</p>
  </section>

  <!-- ===== 量表 ===== -->
  <section id="form" class="hidden"></section>

  <!-- ===== 结果 ===== -->
  <section id="result" class="hidden"></section>

</div>

<!-- 底部提交条 -->
<div class="p-bar hidden" id="bar">
  <div class="p-bar-in">
    <div class="p-prog">
      <div class="p-prog-bar"><div class="p-prog-in" id="progIn"></div></div>
      <div class="p-prog-t" id="progT">0 / 40 题</div>
    </div>
    <button class="btn btn-primary" id="btnSubmit" disabled>提交</button>
  </div>
</div>

<script src="api/data/core.js?v=2312"></script>
<script src="js/patient.js?v=2312"></script>
</body>
</html>
